# =============================================================================
# JewelQR DEVELOPMENT Docker Compose
# =============================================================================
# ⚠️  WARNING: NOT FOR PRODUCTION USE
# - MongoDB port exposed to host
# - No HTTPS
# - Default credentials
# - No backup service
#
# For production, use: docker-compose.prod.yml
# =============================================================================

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: jewelqr-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-jewelqr_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-jewelqr_secret}
      MONGO_INITDB_DATABASE: jewelqr
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - jewelqr-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Backend API
  backend:
    build:
      context: ./jewelry-qr-backend
      dockerfile: Dockerfile
    container_name: jewelqr-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USER:-jewelqr_admin}:${MONGO_PASS:-jewelqr_secret}@mongodb:27017/jewelqr?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_in_production}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      CORS_ORIGIN: http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jewelqr-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (Nginx)
  frontend:
    image: nginx:alpine
    container_name: jewelqr-frontend
    restart: unless-stopped
    volumes:
      - ./jewelry-qr-frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jewelqr-network

volumes:
  mongo_data:
    driver: local

networks:
  jewelqr-network:
    driver: bridge
