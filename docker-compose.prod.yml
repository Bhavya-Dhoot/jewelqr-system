# Esme Crystal IMS - production stack
#   ERPNext (system of record) + IMS gateway (API + web app) + Caddy (automatic HTTPS)
#
#   cp .env.example .env && cp ims-gateway/.env.example ims-gateway/.env   # fill both
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm provision            # first time only
#
# ERPNext services come from erpnext/docker-compose.yml. Set ERP_PORT=127.0.0.1:8085 in .env
# so ERPNext is reachable only through Caddy (and locally for admin scripts).

include:
  - erpnext/docker-compose.yml

services:
  gateway:
    build:
      context: .
      dockerfile: ims-gateway/Dockerfile
    restart: unless-stopped
    env_file: ims-gateway/.env
    environment:
      NODE_ENV: production
      ERP_URL: http://frontend:8080
    depends_on:
      - frontend
    networks:
      - frappe_network

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      IMS_DOMAIN: ${IMS_DOMAIN:?set IMS_DOMAIN in .env, e.g. ims.esmecrystal.com}
      ERP_DOMAIN: ${ERP_DOMAIN:?set ERP_DOMAIN in .env, e.g. erp.esmecrystal.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - frappe_network

  # One-off: company, categories, locations, custom fields, service user. Safe to re-run.
  provision:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./erpnext:/work:ro
    environment:
      ERP_URL: http://frontend:8080
      ERP_ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD:-admin}
      ERP_COMPANY: ${ERP_COMPANY:-Esme Crystal}
      ERP_COMPANY_ABBR: ${ERP_COMPANY_ABBR:-EC}
    command: ["node", "provision.js"]
    depends_on:
      - frontend
    networks:
      - frappe_network

volumes:
  caddy_data:
  caddy_config:
