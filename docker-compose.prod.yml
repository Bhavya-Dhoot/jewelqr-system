# =============================================================================
# JewelQR Docker Compose — Production Stack
# Services: Nginx (reverse proxy) + Backend (Node.js) + MongoDB
# =============================================================================

services:

  # -----------------------------------------------------------
  # NGINX — HTTP reverse proxy, serves frontend static files
  # -----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: jewelqr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./jewelry-qr-frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jewelqr-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # BACKEND — Node.js API
  # -----------------------------------------------------------
  backend:
    build:
      context: ./jewelry-qr-backend
      dockerfile: Dockerfile
    container_name: jewelqr-backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./jewelry-qr-backend/.env
    environment:
      # Override for Docker networking + auth
      - MONGO_URI=mongodb://jewelqr_admin:${MONGO_PASSWORD:-jewelqr_secure_pwd}@mongo:27017/jewelqr?authSource=admin
      - NODE_ENV=production
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - jewelqr-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -----------------------------------------------------------
  # MONGODB — Database (internal only, not exposed to host)
  # -----------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: jewelqr-mongo
    restart: unless-stopped
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=jewelqr_admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-jewelqr_secure_pwd}
      - MONGO_INITDB_DATABASE=jewelqr
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - jewelqr-net
    command: ["mongod", "--bind_ip_all", "--auth"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

# -----------------------------------------------------------
# NETWORKS
# -----------------------------------------------------------
networks:
  jewelqr-net:
    driver: bridge

# -----------------------------------------------------------
# VOLUMES
# -----------------------------------------------------------
volumes:
  mongo_data:
  backend_uploads:
  backend_logs:
