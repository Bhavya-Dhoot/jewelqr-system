<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User management for JewelQR admin portal">
    <title>User Management | JewelQR Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* User Management Specific Styles */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: var(--spacing-5);
        }

        .user-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--spacing-6);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
            border: 1px solid var(--color-gray-100);
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .user-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary-gold), var(--color-gold-dark));
        }

        .user-card.disabled::before {
            background: var(--color-gray-300);
        }

        .user-card.disabled {
            opacity: 0.7;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-4);
        }

        .user-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: white;
            flex-shrink: 0;
        }

        .avatar-admin {
            background: linear-gradient(135deg, var(--color-primary-gold), var(--color-gold-dark));
        }

        .avatar-staff {
            background: linear-gradient(135deg, var(--color-gray-500), var(--color-gray-700));
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-gray-900);
            margin: 0 0 var(--spacing-1) 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-username {
            font-size: var(--font-size-sm);
            color: var(--color-gray-500);
            margin: 0;
        }

        .user-meta {
            display: flex;
            gap: var(--spacing-3);
            margin-bottom: var(--spacing-5);
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-2);
            padding: var(--spacing-1) var(--spacing-3);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-semibold);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-admin {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.25));
            color: var(--color-gold-dark);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .badge-staff {
            background: var(--color-gray-100);
            color: var(--color-gray-600);
            border: 1px solid var(--color-gray-200);
        }

        .badge-active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.2));
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-disabled {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.2));
            color: #DC2626;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .user-stats {
            display: flex;
            gap: var(--spacing-4);
            padding: var(--spacing-4);
            background: var(--color-gray-50);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-5);
        }

        .stat-item {
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            color: var(--color-gray-900);
        }

        .stat-label {
            font-size: var(--font-size-xs);
            color: var(--color-gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .user-actions {
            display: flex;
            gap: var(--spacing-3);
        }

        .user-actions button {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-2);
            padding: var(--spacing-3);
            border: none;
            border-radius: var(--radius-lg);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .btn-toggle-status {
            background: var(--color-gray-100);
            color: var(--color-gray-700);
        }

        .btn-toggle-status:hover {
            background: var(--color-gray-200);
        }

        .btn-toggle-status.disable {
            background: rgba(239, 68, 68, 0.1);
            color: #DC2626;
        }

        .btn-toggle-status.enable {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
        }

        .btn-change-role {
            background: rgba(212, 175, 55, 0.1);
            color: var(--color-gold-dark);
        }

        .btn-change-role:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .btn-reset-password {
            background: rgba(59, 130, 246, 0.1);
            color: #2563EB;
        }

        .btn-reset-password:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        /* Add User Button */
        .add-user-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--spacing-6);
            box-shadow: var(--shadow-sm);
            border: 2px dashed var(--color-gray-200);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .add-user-card:hover {
            border-color: var(--color-primary-gold);
            background: rgba(212, 175, 55, 0.02);
        }

        .add-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary-gold), var(--color-gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-4);
        }

        .add-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .add-text {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-gray-700);
        }

        .add-subtext {
            font-size: var(--font-size-sm);
            color: var(--color-gray-400);
            margin-top: var(--spacing-1);
        }

        /* Modal Enhancements */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 35, 50, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-4);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            background: #FFFFFF;
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalSlide 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: var(--spacing-6);
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        .modal-title {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-gray-900);
            margin: 0;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #F3F4F6;
            color: #6B7280;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: #E5E7EB;
            color: #1F2937;
        }

        .modal-body {
            padding: var(--spacing-6);
            background: #FFFFFF;
        }

        .form-group {
            margin-bottom: var(--spacing-5);
        }

        .form-label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-gray-700);
            margin-bottom: var(--spacing-2);
        }

        .form-input {
            width: 100%;
            padding: var(--spacing-3) var(--spacing-4);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            font-size: var(--font-size-base);
            transition: all var(--transition-base);
            background: #FFFFFF;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .form-select {
            width: 100%;
            padding: var(--spacing-3) var(--spacing-4);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            font-size: var(--font-size-base);
            background: var(--color-surface);
            cursor: pointer;
        }

        .modal-footer {
            padding: var(--spacing-4) var(--spacing-6) var(--spacing-6);
            display: flex;
            gap: var(--spacing-3);
            background: #FFFFFF;
            border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        }

        .modal-footer .btn {
            flex: 1;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: var(--spacing-10);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--spacing-4);
            background: var(--color-gray-100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg {
            width: 40px;
            height: 40px;
            color: var(--color-gray-400);
        }

        /* Stats Header */
        .stats-header {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-6);
        }

        .stat-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--spacing-5);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-card-value {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-gray-900);
        }

        .stat-card-label {
            font-size: var(--font-size-sm);
            color: var(--color-gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card.gold .stat-card-value {
            color: var(--color-primary-gold);
        }

        /* Loading State */
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-10);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--color-gray-200);
            border-top-color: var(--color-primary-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .users-grid {
                grid-template-columns: 1fr;
            }

            .stats-header {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="h1">User Management</h1>
                <p class="text-gray" style="margin-top: var(--spacing-2);">Manage admin and staff accounts</p>
            </div>

        <!-- Stats Overview -->
        <div class="stats-header" id="statsHeader">
            <div class="stat-card">
                <div class="stat-card-value" id="totalUsers">-</div>

            </div>
            <div class="stat-card gold">
                <div class="stat-card-value" id="adminCount">-</div>
                <div class="stat-card-label">Admins</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="staffCount">-</div>
                <div class="stat-card-label">Staff</div>

    <!-- Add/Edit User Modal -->
    <div class="modal-overlay" id="userModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New User</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="userForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-input" required minlength="3"
                            placeholder="e.g., john_doe">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="name">Display Name</label>
                        <input type="text" id="name" name="name" class="form-input" required
                            placeholder="e.g., John Doe">
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-input" required minlength="6"
                            placeholder="Minimum 6 characters">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="role">Role</label>
                        <select id="role" name="role" class="form-select">
                            <option value="staff">Staff (Limited Access)</option>
                            <option value="admin">Admin (Full Access)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">Reset Password</h2>
                <button class="modal-close" id="resetModalClose">&times;</button>
            </div>
            <form id="resetForm">
                <div class="modal-body">
                    <input type="hidden" id="resetUserId">
                    <p id="resetUserName" style="color: var(--color-gray-600); margin-bottom: var(--spacing-4);"></p>
                    <div class="form-group">
                        <label class="form-label" for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" class="form-input" required
                            minlength="6" placeholder="Minimum 6 characters">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="resetCancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Reset Password</button>
                </div>
            </form>
        </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Protect page - requires authentication AND admin role
        (function () {
            if (!auth.isAuthenticated()) {
                sessionStorage.setItem('redirect_after_login', window.location.href);
                window.location.href = 'login.html';
                return;
            }

            const currentUser = auth.getCurrentUser();
            if (!currentUser || currentUser.role !== 'admin') {
                window.location.href = 'restricted.html';
                return;
            }

            initializePage();
        })();

        function initializePage() {
            const usersGrid = document.getElementById('usersGrid');
            const userModal = document.getElementById('userModal');
            const resetModal = document.getElementById('resetModal');
            const userForm = document.getElementById('userForm');
            const resetForm = document.getElementById('resetForm');

            async function loadUsers() {
                try {
                    const response = await api.getUsers();
                    if (response.success) {
                        renderStats(response.data);
                        renderUsers(response.data);
                    }
                } catch (error) {
                    usersGrid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <div class="empty-icon">
                                <svg width="40" height="40" viewBox="0 0 20 20" fill="none">
                                    <path d="M10 18a8 8 0 100-16 8 8 0 000 16zM10 6v4M10 14h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </div>
                            <p style="color: var(--color-gray-600);">Failed to load users</p>
                            <p style="color: var(--color-gray-400); font-size: var(--font-size-sm);">${error.message}</p>
                        </div>
                    `;
                }
            }

            function renderStats(users) {
                const admins = users.filter(u => u.role === 'admin');
                const staff = users.filter(u => u.role === 'staff');
                const active = users.filter(u => u.isActive);

                document.getElementById('totalUsers').textContent = users.length;
                document.getElementById('adminCount').textContent = admins.length;
                document.getElementById('staffCount').textContent = staff.length;
                document.getElementById('activeCount').textContent = active.length;
            }

            function renderUsers(users) {
                const addCard = `
                    <div class="add-user-card" id="addUserCard">
                        <div class="add-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="add-text">Add New User</div>
                        <div class="add-subtext">Create admin or staff account</div>
                    </div>
                `;

                if (!users || users.length === 0) {
                    usersGrid.innerHTML = addCard + `
                        <div class="empty-state" style="grid-column: span 2;">
                            <div class="empty-icon">
                                <svg width="40" height="40" viewBox="0 0 20 20" fill="none">
                                    <path d="M14 6a4 4 0 11-8 0 4 4 0 018 0zM4 16a8 8 0 0116 0" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </div>
                            <p>No users found</p>
                        </div>
                    `;
                    document.getElementById('addUserCard').addEventListener('click', openAddModal);
                    return;
                }

                usersGrid.innerHTML = addCard + users.map(user => `
                    <div class="user-card ${user.isActive ? '' : 'disabled'}" data-id="${user.id}">
                        <div class="user-header">
                            <div class="user-avatar ${user.role === 'admin' ? 'avatar-admin' : 'avatar-staff'}">
                                ${user.name.charAt(0).toUpperCase()}
                            </div>
                            <div class="user-info">
                                <h3 class="user-name">${user.name}</h3>
                                <p class="user-username">@${user.username}</p>
                            </div>
                        </div>
                        <div class="user-meta">
                            <span class="badge ${user.role === 'admin' ? 'badge-admin' : 'badge-staff'}">
                                ${user.role === 'admin' ? '👑 Admin' : '👤 Staff'}
                            </span>
                            <span class="badge ${user.isActive ? 'badge-active' : 'badge-disabled'}">
                                ${user.isActive ? '● Active' : '○ Disabled'}
                            </span>
                        </div>
                        <div class="user-stats">
                            <div class="stat-item">
                                <div class="stat-value">${formatDate(user.createdAt)}</div>
                                <div class="stat-label">Joined</div>
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="btn-toggle-status ${user.isActive ? 'disable' : 'enable'}" 
                                    onclick="toggleUser('${user.id}', ${user.isActive})" 
                                    title="${user.isActive ? 'Disable' : 'Enable'}">
                                ${user.isActive ? '🔒 Disable' : '🔓 Enable'}
                            </button>
                            <button class="btn-change-role" onclick="toggleRole('${user.id}', '${user.role}')" title="Change Role">
                                👤 Role
                            </button>
                            <button class="btn-reset-password" onclick="showResetModal('${user.id}', '${user.username}')" title="Reset Password">
                                🔑
                            </button>
                        </div>
                    </div>
                `).join('');

                document.getElementById('addUserCard').addEventListener('click', openAddModal);
            }

            function formatDate(dateStr) {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            }

            function openAddModal() {
                document.getElementById('modalTitle').textContent = 'Add New User';
                document.getElementById('submitBtn').textContent = 'Create User';
                document.getElementById('passwordGroup').style.display = 'block';
                userForm.reset();
                document.getElementById('username').disabled = false;
                userModal.classList.add('active');
            }

            window.toggleUser = async function (id, currentStatus) {
                const action = currentStatus ? 'disable' : 'enable';
                if (!confirm(`Are you sure you want to ${action} this user?`)) return;

                try {
                    const response = await api.updateUser(id, { isActive: !currentStatus });
                    if (response.success) {
                        showToast(`User ${action}d successfully`, 'success');
                        if (response.data.tokenInvalidated) {
                            showToast('User sessions have been terminated', 'info');
                        }
                        loadUsers();
                    }
                } catch (error) {
                    showToast('Failed: ' + error.message, 'error');
                }
            };

            window.toggleRole = async function (id, currentRole) {
                const newRole = currentRole === 'admin' ? 'staff' : 'admin';
                if (!confirm(`Change role from ${currentRole.toUpperCase()} to ${newRole.toUpperCase()}?`)) return;

                try {
                    const response = await api.updateUser(id, { role: newRole });
                    if (response.success) {
                        showToast(`Role changed to ${newRole.toUpperCase()}`, 'success');
                        loadUsers();
                    }
                } catch (error) {
                    showToast('Failed: ' + error.message, 'error');
                }
            };

            window.showResetModal = function (id, username) {
                document.getElementById('resetUserId').value = id;
                document.getElementById('resetUserName').textContent = `Resetting password for: @${username}`;
                document.getElementById('newPassword').value = '';
                resetModal.classList.add('active');
            };

            // Modal handlers
            document.getElementById('modalClose').addEventListener('click', () => userModal.classList.remove('active'));
            document.getElementById('cancelBtn').addEventListener('click', () => userModal.classList.remove('active'));
            document.getElementById('resetModalClose').addEventListener('click', () => resetModal.classList.remove('active'));
            document.getElementById('resetCancelBtn').addEventListener('click', () => resetModal.classList.remove('active'));

            // Close modal on overlay click
            userModal.addEventListener('click', (e) => {
                if (e.target === userModal) userModal.classList.remove('active');
            });
            resetModal.addEventListener('click', (e) => {
                if (e.target === resetModal) resetModal.classList.remove('active');
            });

            userForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(userForm);
                const userData = {
                    username: formData.get('username'),
                    password: formData.get('password'),
                    name: formData.get('name'),
                    role: formData.get('role')
                };

                try {
                    const response = await api.createUser(userData);
                    if (response.success) {
                        showToast('User created successfully', 'success');
                        userModal.classList.remove('active');
                        loadUsers();
                    }
                } catch (error) {
                    showToast('Failed: ' + error.message, 'error');
                }
            });

            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const userId = document.getElementById('resetUserId').value;
                const newPassword = document.getElementById('newPassword').value;

                try {
                    const response = await api.resetUserPassword(userId, newPassword);
                    if (response.success) {
                        showToast('Password reset successfully', 'success');
                        resetModal.classList.remove('active');
                    }
                } catch (error) {
                    showToast('Failed: ' + error.message, 'error');
                }
            });

            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.style.cssText = `
                    background: ${type === 'error' ? '#EF4444' : type === 'success' ? '#10B981' : '#3B82F6'};
                    color: white;
                    padding: 1rem 1.5rem;
                    border-radius: 12px;
                    margin-bottom: 0.5rem;
                    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                    animation: slideIn 0.3s ease;
                    font-weight: 500;
                `;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }

            // Logout handler
            document.getElementById('logoutBtn').addEventListener('click', auth.logout);

            // Initialize
            loadUsers();
        }
    </script>
</body>

</html>
