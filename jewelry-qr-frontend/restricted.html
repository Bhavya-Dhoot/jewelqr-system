<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted - JewelQR</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/nav.css">
    <style>
        .restricted-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .restricted-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
        }

        .restricted-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .restricted-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 1rem;
        }

        .restricted-message {
            color: var(--color-gray-600);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .restricted-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <span class="nav-logo">💎</span>
                <span class="nav-title">JewelQR</span>
            </a>
            <div class="nav-links">
                <a href="scan.html" class="nav-link">Scan</a>
                <a href="login.html" class="nav-link" id="logoutLink">Logout</a>
            </div>
        </div>
    </nav>

    <div class="restricted-container">
        <div class="restricted-card">
            <div class="restricted-icon">🔒</div>
            <h1 class="restricted-title">Access Restricted</h1>
            <p class="restricted-message">
                You don't have permission to access the admin portal.
                Your role is limited to basic access only.
                <br><br>
                If you need admin access, please contact your administrator.
            </p>
            <div class="restricted-actions">
                <a href="scan.html" class="btn btn-primary">Go to Scan Page</a>
                <button class="btn btn-secondary" id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Handle logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await auth.logout();
        });
        document.getElementById('logoutLink').addEventListener('click', async (e) => {
            e.preventDefault();
            await auth.logout();
        });

        // Show user info if logged in
        const user = auth.getCurrentUser();
        if (user) {
            console.log('Logged in as:', user.username, '- Role:', user.role);
        }
    </script>
</body>

</html>
